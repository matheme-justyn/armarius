[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armarius"
version = "0.5.0"
description = "Academic knowledge management system - from PDF to structured knowledge cards"
authors = [
    {name = "Justyn Chen", email = "your-email@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TBD"}
keywords = ["academic", "research", "pdf", "knowledge-management", "rag"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "streamlit>=1.30.0",
    "pymupdf>=1.24.0",
    "pandas>=2.0.0",
    # Merged from Capsa: semantic search + multi-agent stack
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
mcp = [
    "mcp>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/matheme-justyn/armarius"
Documentation = "https://github.com/matheme-justyn/armarius/tree/main/docs"
Repository = "https://github.com/matheme-justyn/armarius"
Issues = "https://github.com/matheme-justyn/armarius/issues"

[project.scripts]
armarius = "armarius.cli:main"
armarius-mcp = "armarius.mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["armarius*"]
exclude = ["tests*", "docs*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
